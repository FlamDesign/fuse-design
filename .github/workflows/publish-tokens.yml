name: Publish tokens

# Publishes packages/tokens to npm when its version changes on main.
# Auth is npm trusted publishing (OIDC): there is no npm token in this repo.
# The trusted publisher on npmjs.com is tied to this file name, so do not rename it.

on:
  push:
    branches: [main]
    paths:
      - packages/tokens/package.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: Skip if this version is already on npm
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
